name: Temporary Solitaire settings version patch

on:
  push:
    branches: [tmp/solitaire-version-patch-run]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/solitaire-version-patch-run
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch version display
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))

          replace_once('apps/solitaire/app.js', "const APP_VERSION = '1.0.3';", "const APP_VERSION = '1.0.4';")
          replace_once(
              'apps/solitaire/app.js',
              "$('#versionValue').textContent = APP_VERSION;",
              "$$('[data-version-value]').forEach((element) => { element.textContent = APP_VERSION; });"
          )
          replace_once(
              'apps/solitaire/index.html',
              '<p id="settingsNotice" class="settings-notice" hidden>These choices apply to the next deal. The current game keeps its rules.</p>',
              '<p class="version settings-version">Version <span data-version-value>1.0.4</span></p>\n\n      <p id="settingsNotice" class="settings-notice" hidden>These choices apply to the next deal. The current game keeps its rules.</p>'
          )
          replace_once(
              'apps/solitaire/index.html',
              '<p class="version">Version <span id="versionValue">1.0.0</span></p>',
              '<p class="version">Version <span data-version-value>1.0.4</span></p>'
          )
          replace_once('apps/solitaire/service-worker.js', "const CACHE_NAME = 'solitaire-v1.0.3';", "const CACHE_NAME = 'solitaire-v1.0.4';")

          p = Path('tests/solitaire-ui-feedback.test.js')
          s = p.read_text()
          s = s.replace("const sw = fs.readFileSync(new URL('../apps/solitaire/service-worker.js', import.meta.url), 'utf8');", "const sw = fs.readFileSync(new URL('../apps/solitaire/service-worker.js', import.meta.url), 'utf8');\nconst html = fs.readFileSync(new URL('../apps/solitaire/index.html', import.meta.url), 'utf8');")
          s = s.replace("APP_VERSION = '1\\.0\\.3'", "APP_VERSION = '1\\.0\\.4'")
          s = s.replace("solitaire-v1\\.0\\.3", "solitaire-v1\\.0\\.4")
          s += "\n\ntest('version is visible in both settings and menu', () => {\n  assert.equal((html.match(/data-version-value/g) || []).length, 2);\n  assert.match(app, /data-version-value/);\n});\n"
          p.write_text(s)
          PY
      - run: node --check apps/solitaire/app.js
      - run: node --check apps/solitaire/service-worker.js
      - run: npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/solitaire/app.js apps/solitaire/index.html apps/solitaire/service-worker.js tests/solitaire-ui-feedback.test.js
          git commit -m "Show Solitaire version in settings"
          git push
